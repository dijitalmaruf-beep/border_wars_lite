workflows:
  android-debug-apk:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform wrappers
        script: flutter create . --platforms=android,web
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  web-release:
    name: Web Release Build
    max_build_duration: 45
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform wrappers
        script: flutter create . --platforms=android,web
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build web
        script: flutter build web --release
    artifacts:
      - build/web/**

  tests:
    name: Tests
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform wrappers
        script: flutter create . --platforms=android,web
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test

  ios-debug-no-codesign:
    name: iOS Debug Build (No Code Signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate Flutter iOS platform wrapper
        script: flutter create . --platforms=ios --org com.marleklabs --project-name chroma_conquest
      - name: Set iOS deployment target
        script: |
          perl -0pi -e "s/# platform :ios, '13\.0'/platform :ios, '15.0'/" ios/Podfile
          perl -0pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build iOS without signing
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  ios-testflight-upload:
    name: iOS TestFlight Upload
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - chroma_conquest_appstore
        certificates:
          - chroma_conquest_distribution
      vars:
        BUNDLE_ID: com.marleklabs.chromaconquest
        APP_STORE_APPLE_ID: 6768103796
        APP_VERSION: 1.0.0
        XCODE_PROJECT: ios/Runner.xcodeproj
    scripts:
      - name: Verify Flutter iOS platform wrapper
        script: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create . --platforms=ios --org com.marleklabs --project-name chroma_conquest
          else
            echo "Using committed iOS platform wrapper."
          fi
      - name: Set iOS deployment target
        script: |
          perl -0pi -e 's/^\xEF\xBB\xBF//' ios/Runner.xcodeproj/project.pbxproj
          perl -0pi -e "s/# platform :ios, '13\.0'/platform :ios, '15.0'/" ios/Podfile
          perl -0pi -e "s/platform :ios, '13\.0'/platform :ios, '15.0'/" ios/Podfile
          perl -0pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Verify iOS app identity
        script: |
          grep -n "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj
          grep -n "CFBundleDisplayName" -A1 ios/Runner/Info.plist
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Inspect Codemagic signing files
        script: |
          echo "Provisioning profiles:"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" -maxdepth 1 -type f -print || true
          echo "Code signing certificates:"
          security find-identity -v -p codesigning || true
      - name: Set up Xcode code signing
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --profile "$HOME/Library/MobileDevice/Provisioning Profiles/*.mobileprovision" \
            --export-options-plist "$CM_EXPORT_OPTIONS_PLIST" \
            --warn-only \
            --code-signing-setup-verbose-logging
      - name: Build signed IPA
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=0
          fi
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$CM_EXPORT_OPTIONS_PLIST"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
