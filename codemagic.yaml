workflows:
  android-debug-apk:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform wrappers
        script: flutter create . --platforms=android,web
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  web-release:
    name: Web Release Build
    max_build_duration: 45
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform wrappers
        script: flutter create . --platforms=android,web
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build web
        script: flutter build web --release
    artifacts:
      - build/web/**

  tests:
    name: Tests
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter platform wrappers
        script: flutter create . --platforms=android,web
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test

  ios-debug-no-codesign:
    name: iOS Debug Build (No Code Signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate Flutter iOS platform wrapper
        script: flutter create . --platforms=ios --org com.marleklabs --project-name chroma_conquest
      - name: Set iOS deployment target
        script: |
          perl -0pi -e "s/# platform :ios, '13\.0'/platform :ios, '15.0'/" ios/Podfile
          perl -0pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build iOS without signing
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

# iOS release/App Store workflow will be added later in Codemagic after Apple
# Developer credentials, signing certificates, and provisioning profiles are
# available. Planned bundle id: com.marleklabs.chromaconquest.
